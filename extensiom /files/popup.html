<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>FlyerWise Extractor</title>
  <style>
    body {
      width: 360px;
      max-height: 500px;
      font-family: -apple-system, Segoe UI, Roboto, sans-serif;
      margin: 0;
      padding: 12px;
      color: #1a1a1a;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 4px;
    }
    p.sub {
      font-size: 12px;
      color: #666;
      margin: 0 0 10px;
    }
    .actions {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    button {
      flex: 1;
      padding: 6px 8px;
      font-size: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #f7f7f7;
      cursor: pointer;
    }
    button:hover { background: #eee; }
    #list {
      max-height: 340px;
      overflow-y: auto;
      border-top: 1px solid #eee;
    }
    .item {
      display: flex;
      gap: 8px;
      padding: 6px 0;
      border-bottom: 1px solid #f0f0f0;
      align-items: center;
    }
    .item img {
      width: 36px;
      height: 36px;
      object-fit: contain;
      border-radius: 4px;
      background: #fafafa;
      flex-shrink: 0;
    }
    .item .name {
      font-size: 12px;
      flex: 1;
    }
    .item .price {
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }
    #empty {
      font-size: 12px;
      color: #888;
      padding: 20px 0;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>FlyerWise Extractor</h1>
  <p class="sub" id="status">No items captured yet.</p>
  <div class="actions">
    <button id="syncDb" style="background:#059669;color:#fff;font-weight:600;border:none;">Sync DB</button>
    <button id="exportJson">JSON</button>
    <button id="exportCsv">CSV</button>
    <button id="clear">Clear</button>
  </div>
  <div id="list"></div>
  <script src="popup.js"></script>
</body>
</html>
